<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="workflow-title workflow-desc">
  <title id="workflow-title">Workflow de una Task en AIWS</title>
  <desc id="workflow-desc">Draft pasa explícitamente a Curating. Una Question abierta lleva la Task a Blocked y la última respuesta la devuelve automáticamente a Curating. El curator decide Ready, la implementación pasa por Implementing hasta Done y un Message crea otro Cycle en Curating.</desc>
  <defs>
    <pattern id="workflow-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#d4e0e8" stroke-width="1"/>
    </pattern>
    <marker id="arrow-explicit" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M1 1 9 5 1 9z" fill="#15a9fe"/>
    </marker>
    <marker id="arrow-auto" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M1 1 9 5 1 9z" fill="#536577"/>
    </marker>
    <filter id="workflow-shadow" x="-12%" y="-18%" width="124%" height="145%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0f1c2e" flood-opacity=".09"/>
    </filter>
    <style>
      .title{font:700 48px Oxanium,ui-sans-serif,system-ui,sans-serif;fill:#0f1c2e;letter-spacing:-1px}
      .subtitle{font:500 21px Oxanium,ui-sans-serif,system-ui,sans-serif;fill:#536577}
      .state{font:650 24px Oxanium,ui-sans-serif,system-ui,sans-serif;fill:#0f1c2e}
      .note{font:500 15px Oxanium,ui-sans-serif,system-ui,sans-serif;fill:#536577}
      .actor{font:700 13px Oxanium,ui-sans-serif,system-ui,sans-serif;fill:#0f4568;letter-spacing:1px}
      .label{font:600 15px Oxanium,ui-sans-serif,system-ui,sans-serif;fill:#18324b}
      .legend{font:550 15px Oxanium,ui-sans-serif,system-ui,sans-serif;fill:#536577}
      .explicit{fill:none;stroke:#15a9fe;stroke-width:4;stroke-linecap:square;stroke-linejoin:miter;marker-end:url(#arrow-explicit)}
      .automatic{fill:none;stroke:#536577;stroke-width:3;stroke-linecap:square;stroke-dasharray:9 9;marker-end:url(#arrow-auto)}
    </style>
  </defs>
  <rect width="1600" height="900" fill="#f7fafc"/>
  <rect width="1600" height="900" fill="url(#workflow-grid)" opacity=".46"/>
  <rect x="0" y="0" width="12" height="900" fill="#15a9fe"/>
  <circle cx="1516" cy="84" r="164" fill="#ddf2ff" opacity=".82"/>
  <text x="82" y="92" class="title">Una Task, un workflow explícito</text>
  <text x="82" y="132" class="subtitle">La petición se congela al entrar en Curating. Ready siempre es una decisión del curator.</text>

  <g filter="url(#workflow-shadow)">
    <rect x="52" y="278" width="236" height="150" fill="#fff" stroke="#d4e0e8" stroke-width="2"/>
    <rect x="367" y="278" width="236" height="150" fill="#fff" stroke="#15a9fe" stroke-width="3"/>
    <rect x="682" y="278" width="236" height="150" fill="#fff" stroke="#d4e0e8" stroke-width="2"/>
    <rect x="997" y="278" width="236" height="150" fill="#fff" stroke="#d4e0e8" stroke-width="2"/>
    <rect x="1312" y="278" width="236" height="150" fill="#0f1c2e" stroke="#0f1c2e" stroke-width="2"/>
  </g>
  <g text-anchor="middle">
    <text x="170" y="338" class="state">Draft</text><text x="170" y="374" class="note">petición editable</text>
    <text x="485" y="338" class="state">Curating</text><text x="485" y="374" class="note">curación en curso</text>
    <text x="800" y="338" class="state">Ready</text><text x="800" y="374" class="note">lista para reclamar</text>
    <text x="1115" y="338" class="state">Implementing</text><text x="1115" y="374" class="note">trabajo reclamado</text>
    <text x="1430" y="338" class="state" style="fill:#fff">Done</text><text x="1430" y="374" class="note" style="fill:#c8d7e1">trabajo terminado</text>
  </g>

  <path d="M288 350h69" class="explicit"/>
  <path d="M603 350h69" class="explicit"/>
  <path d="M918 350h69" class="explicit"/>
  <path d="M1233 350h69" class="explicit"/>
  <g text-anchor="middle">
    <text x="327" y="219" class="actor">USUARIO</text><text x="327" y="244" class="label">envía a Curation</text>
    <text x="642" y="219" class="actor">CURATOR</text><text x="642" y="244" class="label">decide Ready</text>
    <text x="957" y="219" class="actor">IMPLEMENTADOR</text><text x="957" y="244" class="label">claim atómico</text>
    <text x="1272" y="219" class="actor">IMPLEMENTADOR</text><text x="1272" y="244" class="label">completa</text>
  </g>

  <g filter="url(#workflow-shadow)">
    <rect x="335" y="654" width="300" height="136" fill="#eff4f7" stroke="#536577" stroke-width="2"/>
  </g>
  <g text-anchor="middle">
    <text x="485" y="710" class="state">Blocked</text>
    <text x="485" y="745" class="note">espera respuestas</text>
  </g>
  <path d="M485 428v216" class="automatic"/>
  <rect x="532" y="506" width="296" height="66" fill="#fff" stroke="#c8d7e1" stroke-width="2"/>
  <text x="680" y="532" text-anchor="middle" class="actor">CURATOR · QUESTION</text>
  <text x="680" y="556" text-anchor="middle" class="label">una abierta bloquea</text>

  <path d="M335 722H190c-42 0-62-24-62-66V492c0-42 24-64 66-64h281" class="automatic"/>
  <rect x="78" y="510" width="304" height="66" fill="#fff" stroke="#c8d7e1" stroke-width="2"/>
  <text x="230" y="536" text-anchor="middle" class="actor">USUARIO</text>
  <text x="230" y="560" text-anchor="middle" class="label">la última respuesta reanuda</text>

  <path d="M1430 428v110c0 40-28 60-68 60H555c-46 0-70-22-70-64v-96" class="explicit"/>
  <rect x="908" y="563" width="338" height="66" fill="#fff" stroke="#d4e0e8" stroke-width="2"/>
  <text x="1077" y="589" text-anchor="middle" class="actor">USUARIO · MESSAGE</text>
  <text x="1077" y="613" text-anchor="middle" class="label">crea Cycle y vuelve a Curating</text>

  <g transform="translate(1000 840)">
    <path d="M0 0h58" class="explicit"/><text x="76" y="5" class="legend">decisión explícita</text>
    <path d="M280 0h58" class="automatic"/><text x="356" y="5" class="legend">reacción automática</text>
  </g>
</svg>
