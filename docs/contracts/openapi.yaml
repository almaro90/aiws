components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
    sessionCookie:
      type: apiKey
      in: cookie
      name: aiws_session
  headers:
    TaskETag:
      description: Current Task version as a quoted integer.
      schema:
        type: string
        examples: ['"4"']
  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/ProjectId"
    ProjectIdQuery:
      name: projectId
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/ProjectId"
    TaskId:
      name: taskId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/TaskId"
    QuestionId:
      name: questionId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/QuestionId"
    AttachmentId:
      name: attachmentId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/AttachmentId"
    ConnectionId:
      name: connectionId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/ConnectionId" }
    AzureAuthorizationId:
      name: authorizationId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/AzureAuthorizationId" }
    AgentProfileId:
      name: agentProfileId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/AgentProfileId" }
    RunId:
      name: runId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/RunId" }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Expected Task version, conventionally quoted.
      schema:
        type: string
        pattern: '^"?[1-9][0-9]*"?$'
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        minLength: 1
    Archived:
      name: archived
      in: query
      required: false
      schema:
        type: boolean
        default: false
    GitProvider:
      name: gitProvider
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/GitProvider"
    AccountScope:
      name: accountScope
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/AccountScope"
  responses:
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Conflict:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ValidationError:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    PreconditionRequired:
      description: If-Match required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    PayloadTooLarge:
      description: Attachment too large
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    UnsupportedMediaType:
      description: Unsupported attachment type
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    TooManyRequests:
      description: Rate limit exceeded
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    ProjectId:
      type: string
      pattern: '^prj_[0-9A-HJKMNP-TV-Z]{26}$'
    TaskId:
      type: string
      pattern: '^tsk_[0-9A-HJKMNP-TV-Z]{26}$'
    QuestionId:
      type: string
      pattern: '^qst_[0-9A-HJKMNP-TV-Z]{26}$'
    OptionId:
      type: string
      pattern: '^opt_[0-9A-HJKMNP-TV-Z]{26}$'
    AttachmentId:
      type: string
      pattern: '^att_[0-9A-HJKMNP-TV-Z]{26}$'
    EventId:
      type: string
      pattern: '^evt_[0-9A-HJKMNP-TV-Z]{26}$'
    ConnectionId:
      type: string
      pattern: '^con_[0-9A-HJKMNP-TV-Z]{26}$'
    AzureAuthorizationId:
      type: string
      pattern: '^azr_[0-9A-HJKMNP-TV-Z]{26}$'
    AgentProfileId:
      type: string
      pattern: '^agp_[0-9A-HJKMNP-TV-Z]{26}$'
    RunId:
      type: string
      pattern: '^run_[0-9A-HJKMNP-TV-Z]{26}$'
    TaskCycleId: { type: string, pattern: '^cyc_[0-9A-HJKMNP-TV-Z]{26}$' }
    TaskMessageId: { type: string, pattern: '^msg_[0-9A-HJKMNP-TV-Z]{26}$' }
    SpecRevisionId: { type: string, pattern: '^spc_[0-9A-HJKMNP-TV-Z]{26}$' }
    QuestionAnswerId: { type: string, pattern: '^ans_[0-9A-HJKMNP-TV-Z]{26}$' }
    DeliveryId: { type: string, pattern: '^dlv_[0-9A-HJKMNP-TV-Z]{26}$' }
    Timestamp:
      type: string
      format: date-time
    GitProvider:
      type: string
      enum: [github, azure_devops, gitlab, other]
    AccountScope:
      type: string
      enum: [personal, work]
    ReadyPolicy:
      type: string
      enum: [curator_decides, manual_approval_required]
    TaskStatus:
      type: string
      enum: [draft, curating, blocked, ready, implementing, done]
    RunKind:
      type: string
      enum: [curation, implementation]
    QuestionType:
      type: string
      enum: [text, single_choice, multiple_choice]
    QuestionStatus:
      type: string
      enum: [open, answered, dismissed]
    ActorType:
      type: string
      enum: [web, cli, system]
    Health:
      type: object
      additionalProperties: false
      required: [status, version]
      properties:
        status:
          type: string
          enum: [ok, unhealthy]
        version:
          type: string
    RunnerStatus:
      type: object
      additionalProperties: false
      required: [status, lastSeenAt, offlineAfterSeconds]
      properties:
        status:
          type: string
          enum: [online, offline, unknown]
        lastSeenAt:
          oneOf: [{ $ref: "#/components/schemas/Timestamp" }, { type: "null" }]
        offlineAfterSeconds:
          type: integer
          minimum: 1
    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 120
        password:
          type: string
          minLength: 1
          maxLength: 1024
    Session:
      type: object
      additionalProperties: false
      required: [authenticated, username]
      properties:
        authenticated:
          type: boolean
          const: true
        username:
          type: string
    NotificationSettings:
      type: object
      additionalProperties: false
      required: [enabled, baseUrl, topic, accessTokenConfigured, updatedAt]
      properties:
        enabled: { type: boolean }
        baseUrl: { type: string, format: uri }
        topic: { type: string, maxLength: 64, pattern: '^[-_A-Za-z0-9]*$' }
        accessTokenConfigured: { type: boolean }
        updatedAt: { $ref: "#/components/schemas/Timestamp" }
    UpdateNotificationSettingsRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        enabled: { type: boolean }
        baseUrl:
          type: string
          format: uri
          description: HTTP/HTTPS URL without credentials, query parameters or fragment.
        topic: { type: string, maxLength: 64, pattern: '^[-_A-Za-z0-9]*$' }
        accessToken:
          type: [string, "null"]
          minLength: 1
          maxLength: 4096
          writeOnly: true
    Project:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - description
        - repositoryPath
        - gitProvider
        - accountScope
        - repositoryMode
        - connectionId
        - remoteRepositoryId
        - remoteFullName
        - remoteWebUrl
        - defaultBranch
        - automationEnabled
        - curationAgentProfileId
        - implementationAgentProfileId
        - scheduleCron
        - scheduleTimezone
        - maxConcurrency
        - readyPolicy
        - createdAt
        - updatedAt
        - archivedAt
      properties:
        id:
          $ref: "#/components/schemas/ProjectId"
        name:
