          minLength: 1
          maxLength: 120
        description:
          type: string
          maxLength: 10000
        repositoryPath:
          type: string
          minLength: 1
        gitProvider:
          $ref: "#/components/schemas/GitProvider"
        accountScope:
          $ref: "#/components/schemas/AccountScope"
        repositoryMode:
          type: string
          enum: [local, managed]
        connectionId:
          oneOf: [{ $ref: "#/components/schemas/ConnectionId" }, { type: "null" }]
        remoteRepositoryId: { type: [string, "null"] }
        remoteFullName: { type: [string, "null"] }
        remoteWebUrl: { type: [string, "null"], format: uri }
        defaultBranch: { type: [string, "null"] }
        automationEnabled: { type: boolean }
        curationAgentProfileId:
          oneOf: [{ $ref: "#/components/schemas/AgentProfileId" }, { type: "null" }]
        implementationAgentProfileId:
          oneOf: [{ $ref: "#/components/schemas/AgentProfileId" }, { type: "null" }]
        scheduleCron: { type: [string, "null"] }
        scheduleTimezone: { type: string }
        maxConcurrency: { type: integer, minimum: 1, maximum: 16 }
        readyPolicy: { $ref: "#/components/schemas/ReadyPolicy" }
        createdAt:
          $ref: "#/components/schemas/Timestamp"
        updatedAt:
          $ref: "#/components/schemas/Timestamp"
        archivedAt:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
