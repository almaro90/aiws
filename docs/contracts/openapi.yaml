openapi: 3.1.0
info:
  title: AIWS API
  version: 0.8.0
  description: Contract for AIWS v0.8.0.
  license:
    name: GNU Affero General Public License v3.0 only
    identifier: AGPL-3.0-only
servers:
  - url: /api/v1
security:
  - bearerAuth: []
  - sessionCookie: []
tags:
  - name: Health
    description: Process health and contract discovery.
  - name: System
    description: Runtime worker observability.
  - name: Auth
    description: Web session authentication.
  - name: Projects
    description: Project inventory.
  - name: Tasks
    description: Task aggregate and workflow.
  - name: Questions
    description: Curator questions and answers.
  - name: Attachments
    description: Authenticated task files.
  - name: Activity
    description: Append-only task activity.
  - name: Timeline
    description: Chronological Task conversation grouped by cycle.
  - name: Connections
    description: Authorized source-control installations.
  - name: AgentProfiles
    description: Configured agent runtimes.
  - name: Runs
    description: Isolated automated implementation attempts.
  - name: Notifications
    description: Global ntfy notification settings.
paths:
  /health:
    get:
      tags: [Health]
      operationId: getHealth
      summary: Get server health
      security: []
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: Unhealthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /system/runner:
    get:
      tags: [System]
      operationId: getRunnerStatus
      summary: Get runner-manager liveness from its latest authenticated API activity
      responses:
        "200":
          description: Runner activity status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunnerStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Create a Web session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "204":
          description: Logged in
          headers:
            Set-Cookie:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "422":
          $ref: "#/components/responses/ValidationError"
  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: End the Web session
      security:
        - sessionCookie: []
      responses:
        "204":
          description: Logged out
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/session:
    get:
      tags: [Auth]
      operationId: getSession
      summary: Get the current Web session
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /openapi.json:
    get:
      tags: [Health]
      operationId: getOpenApi
      summary: Get the generated OpenAPI contract
      responses:
        "200":
          description: Generated OpenAPI document
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          $ref: "#/components/responses/Unauthorized"
  /notification-settings:
    get:
      tags: [Notifications]
      operationId: getNotificationSettings
      summary: Get the masked global ntfy configuration
      responses:
        "200":
          description: Notification settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationSettings" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    patch:
      tags: [Notifications]
      operationId: updateNotificationSettings
      summary: Update the global ntfy configuration
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateNotificationSettingsRequest" }
      responses:
        "200":
          description: Masked notification settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationSettings" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /notification-settings/test:
    post:
      tags: [Notifications]
      operationId: testNotificationSettings
      summary: Send a synchronous ntfy test notification
      responses:
        "204": { description: Test notification delivered }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503":
          description: ntfy is unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  /connections:
    get:
      tags: [Connections]
      operationId: listConnections
      responses:
        "200":
          description: Connections
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Connection" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /connections/github/install:
    get:
      tags: [Connections]
      operationId: getGitHubInstallationUrl
      parameters:
        - name: returnTo
          in: query
          schema: { type: string }
      responses:
        "200":
          description: GitHub App installation URL
          content:
            application/json:
              schema:
                type: object
                required: [url]
                properties: { url: { type: string, format: uri } }
        "409": { $ref: "#/components/responses/Conflict" }
  /connections/github/callback:
    get:
      tags: [Connections]
      operationId: completeGitHubInstallation
      parameters:
        - { name: state, in: query, required: true, schema: { type: string } }
        - { name: installation_id, in: query, required: true, schema: { type: string } }
      responses:
        "303": { description: Connection registered; redirect to Web }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /connections/azure-devops/authorize:
    get:
      tags: [Connections]
      operationId: authorizeAzureDevOps
      responses:
        "200":
          description: Microsoft Entra authorization URL
          content:
            application/json:
              schema:
                type: object
                required: [url]
                properties: { url: { type: string, format: uri } }
        "409": { $ref: "#/components/responses/Conflict" }
  /connections/azure-devops/callback:
    get:
      tags: [Connections]
      operationId: callbackAzureDevOps
      security: []
      parameters:
        - { name: state, in: query, required: true, schema: { type: string } }
        - { name: code, in: query, required: true, schema: { type: string } }
      responses:
        "303": { description: OAuth completed; redirect to organization selection }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /connections/azure-devops/authorizations/{authorizationId}/organizations:
    get:
      tags: [Connections]
      operationId: listAzureDevOpsOrganizations
      parameters: [{ $ref: "#/components/parameters/AzureAuthorizationId" }]
      responses:
        "200":
          description: Organizations from the encrypted authorization snapshot
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AzureDevOpsOrganization" }
        "409": { $ref: "#/components/responses/Conflict" }
  /connections/azure-devops/authorizations/{authorizationId}/complete:
    post:
      tags: [Connections]
      operationId: completeAzureDevOpsAuthorization
      parameters: [{ $ref: "#/components/parameters/AzureAuthorizationId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CompleteAzureDevOpsAuthorizationRequest" }
      responses:
        "201":
          description: Azure DevOps Connection registered or reauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Connection" }
        "409": { $ref: "#/components/responses/Conflict" }
  /connections/{connectionId}/reauthorize:
    get:
      tags: [Connections]
      operationId: reauthorizeConnection
      parameters: [{ $ref: "#/components/parameters/ConnectionId" }]
      responses:
        "200":
          description: Provider authorization URL
          content:
            application/json:
              schema:
                type: object
                required: [url]
                properties: { url: { type: string, format: uri } }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /connections/{connectionId}/repositories:
    get:
      tags: [Connections]
      operationId: listConnectionRepositories
      parameters: [{ $ref: "#/components/parameters/ConnectionId" }]
      responses:
        "200":
          description: Repositories visible to the installation
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RemoteRepository" }
        "404": { $ref: "#/components/responses/NotFound" }
  /connections/{connectionId}/import:
    post:
      tags: [Connections, Projects]
      operationId: importConnectionRepository
      parameters: [{ $ref: "#/components/parameters/ConnectionId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ImportRepositoryRequest" }
      responses:
        "201":
          description: Managed Project created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /connections/{connectionId}/revoke:
    post:
      tags: [Connections]
      operationId: revokeConnection
      parameters: [{ $ref: "#/components/parameters/ConnectionId" }]
      responses:
        "200":
          description: Revoked Connection
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Connection" }
  /agent-profiles:
    get:
      tags: [AgentProfiles]
      operationId: listAgentProfiles
      responses:
        "200":
          description: Agent Profiles
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AgentProfile" }
    post:
      tags: [AgentProfiles]
      operationId: createAgentProfile
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateAgentProfileRequest" }
      responses:
        "201":
          description: Agent Profile created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentProfile" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /agent-profiles/model-catalog:
    post:
      tags: [AgentProfiles]
      operationId: listAgentProfileModels
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ModelCatalogRequest" }
      responses:
        "200":
          description: Live Codex model catalog
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModelCatalog" }
        "503":
          description: Codex model catalog unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  /agent-profiles/{agentProfileId}/enabled:
    patch:
      tags: [AgentProfiles]
      operationId: setAgentProfileEnabled
      parameters: [{ $ref: "#/components/parameters/AgentProfileId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetAgentProfileEnabledRequest" }
      responses:
        "200":
          description: Agent Profile updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentProfile" }
  /tasks/{taskId}/runs:
    get:
      tags: [Runs]
      operationId: listTaskRuns
      parameters:
        - { $ref: "#/components/parameters/TaskId" }
        - name: kind
          in: query
          schema: { $ref: "#/components/schemas/RunKind" }
      responses:
        "200":
          description: Task Runs
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Run" }
  /runs/{runId}:
    get:
      tags: [Runs]
      operationId: getRun
      parameters: [{ $ref: "#/components/parameters/RunId" }]
      responses:
        "200":
          description: Run
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
        "404": { $ref: "#/components/responses/NotFound" }
  /runs/{runId}/logs:
    get:
      tags: [Runs]
      operationId: getRunLogs
      parameters: [{ $ref: "#/components/parameters/RunId" }]
      responses:
        "200":
          description: Codex JSONL event stream
          content:
            application/x-ndjson:
              schema: { type: string }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Runs]
      operationId: putRunLogs
      parameters: [{ $ref: "#/components/parameters/RunId" }]
      requestBody:
        required: true
        content:
          application/x-ndjson:
            schema: { type: string, maxLength: 5000000 }
      responses:
        "204": { description: Logs stored }
        "403": { $ref: "#/components/responses/Forbidden" }
  /runs/claim:
    post:
      tags: [Runs]
      operationId: claimNextRun
      responses:
        "200":
          description: Claimed assignment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RunAssignment" }
        "204": { description: No eligible Task }
        "403": { $ref: "#/components/responses/Forbidden" }
  /runs/reconcile:
    post:
      tags: [Runs]
      operationId: reconcileRuns
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReconcileRunsRequest" }
      responses:
        "200":
          description: Recovered stale Runs
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Run" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /runs/{runId}/advance:
    post:
      tags: [Runs]
      operationId: advanceRun
      parameters: [{ $ref: "#/components/parameters/RunId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdvanceRunRequest" }
      responses:
        "200":
          description: Updated Run
          content: { application/json: { schema: { $ref: "#/components/schemas/Run" } } }
  /runs/{runId}/heartbeat:
    post:
      tags: [Runs]
      operationId: heartbeatRun
      parameters: [{ $ref: "#/components/parameters/RunId" }]
      responses:
        "200":
          description: Updated Run
          content: { application/json: { schema: { $ref: "#/components/schemas/Run" } } }
  /runs/{runId}/verification:
    get:
      tags: [Runs]
      operationId: getRunVerification
      parameters: [{ $ref: "#/components/parameters/RunId" }]
      responses:
        "200":
          description: Immutable verification evidence
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/VerificationResult" } }
  /runs/{runId}/verification-results:
    post:
      tags: [Runs]
      operationId: recordRunVerification
      parameters: [{ $ref: "#/components/parameters/RunId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecordVerificationResultsRequest" }
      responses:
        "200": { description: Run advanced or failed, content: { application/json: { schema: { $ref: "#/components/schemas/Run" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /runs/{runId}/provenance:
    get:
      tags: [Runs]
      operationId: getRunProvenance
      parameters: [{ $ref: "#/components/parameters/RunId" }]
      responses:
        "200": { description: Immutable Run provenance, content: { application/json: { schema: { $ref: "#/components/schemas/RunProvenance" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Runs]
      operationId: recordRunProvenance
      parameters: [{ $ref: "#/components/parameters/RunId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecordRunProvenanceRequest" }
      responses:
        "201": { description: Provenance stored, content: { application/json: { schema: { $ref: "#/components/schemas/RunProvenance" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /runs/{runId}/git-credentials:
    post:
      tags: [Runs]
      operationId: getRunGitCredentials
      parameters: [{ $ref: "#/components/parameters/RunId" }]
      responses:
        "200":
          description: Short-lived runner-only credentials
          content: { application/json: { schema: { $ref: "#/components/schemas/GitCredentials" } } }
  /runs/{runId}/pull-request:
    post:
      tags: [Runs]
      operationId: createRunPullRequest
      parameters: [{ $ref: "#/components/parameters/RunId" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CreatePullRequestRequest" } } }
      responses:
        "200":
          description: Pull request URL
          content:
            application/json:
              schema:
                type: object
                required: [prUrl]
                properties: { prUrl: { type: string, format: uri } }
  /runs/{runId}/complete:
    post:
      tags: [Runs]
      operationId: completeRun
      parameters: [{ $ref: "#/components/parameters/RunId" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CompleteRunRequest" } } }
      responses:
        "200": { description: Succeeded Run, content: { application/json: { schema: { $ref: "#/components/schemas/Run" } } } }
  /runs/{runId}/curation-result:
    post:
      tags: [Runs]
      operationId: completeCurationRun
      parameters: [{ $ref: "#/components/parameters/RunId" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CompleteCurationRunRequest" } } }
      responses:
        "200": { description: Applied curation result, content: { application/json: { schema: { $ref: "#/components/schemas/Run" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /runs/{runId}/fail:
    post:
      tags: [Runs]
      operationId: failRun
      parameters: [{ $ref: "#/components/parameters/RunId" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/FailRunRequest" } } }
      responses:
        "200": { description: Failed Run, content: { application/json: { schema: { $ref: "#/components/schemas/Run" } } } }
  /runs/{runId}/retry:
    post:
      tags: [Runs]
      operationId: retryRun
      parameters:
        - { $ref: "#/components/parameters/RunId" }
        - { $ref: "#/components/parameters/IfMatch" }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RetryRunRequest" }
      responses:
        "201": { description: Retried assignment, content: { application/json: { schema: { $ref: "#/components/schemas/RunAssignment" } } } }
  /runs/{runId}/cancel:
    post:
      tags: [Runs]
      operationId: cancelRun
      parameters:
        - { $ref: "#/components/parameters/RunId" }
        - { $ref: "#/components/parameters/IfMatch" }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CancelRunRequest" } } }
      responses:
        "200": { description: Cancelled Run, content: { application/json: { schema: { $ref: "#/components/schemas/Run" } } } }
  /runs/{runId}/waive-verification:
    post:
      tags: [Runs]
      operationId: waiveRunVerification
      parameters:
        - { $ref: "#/components/parameters/RunId" }
        - { $ref: "#/components/parameters/IfMatch" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WaiveVerificationRequest" }
      responses:
        "201": { description: Waiver publication assignment, content: { application/json: { schema: { $ref: "#/components/schemas/RunAssignment" } } } }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /attention:
    get:
      tags: [Attention]
      operationId: listAttention
      summary: List deduplicated situations that require an operator
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200":
          description: Attention projection
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AttentionPage" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /deliveries/{deliveryId}/projection:
    get:
      tags: [Deliveries]
      operationId: getDeliveryProjection
      parameters:
        - name: deliveryId
          in: path
          required: true
          schema: { $ref: "#/components/schemas/DeliveryId" }
      responses:
        "200": { description: Last external observation, content: { application/json: { schema: { $ref: "#/components/schemas/Delivery" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
  /deliveries/{deliveryId}/projection/refresh:
    post:
      tags: [Deliveries]
      operationId: refreshDeliveryProjection
      parameters:
        - name: deliveryId
          in: path
          required: true
          schema: { $ref: "#/components/schemas/DeliveryId" }
      responses:
        "200": { description: Refreshed observation, content: { application/json: { schema: { $ref: "#/components/schemas/Delivery" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "502": { description: Safe provider synchronization failure, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
  /projects/{projectId}/metrics:
    get:
      tags: [Metrics]
      operationId: getProjectMetrics
      parameters:
        - { $ref: "#/components/parameters/ProjectId" }
        - name: from
          in: query
          required: true
          schema: { $ref: "#/components/schemas/Timestamp" }
        - name: to
          in: query
          required: true
          schema: { $ref: "#/components/schemas/Timestamp" }
      responses:
        "200": { description: Local product metrics, content: { application/json: { schema: { $ref: "#/components/schemas/ProjectMetrics" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /projects:
    get:
      tags: [Projects]
      operationId: listProjects
      summary: List projects
      parameters:
        - $ref: "#/components/parameters/Archived"
        - $ref: "#/components/parameters/GitProvider"
        - $ref: "#/components/parameters/AccountScope"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Projects
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
    post:
      tags: [Projects]
      operationId: createProject
      summary: Create a project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
  /projects/{projectId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [Projects]
      operationId: getProject
      summary: Get a project
      responses:
        "200":
          description: Project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Projects]
